name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-fast-feedback:
    name: Linux fast feedback
    runs-on: ubuntu-latest
    steps:
      - name: Check out tarlib
        uses: actions/checkout@v7
        with:
          path: tarlib

      # tarlib pins hostkit by path: the extraction side asks it for ownership,
      # links, fifos and device nodes rather than binding calls a host may not
      # have.
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: tarlib
      - name: Set up Ada workspace
        uses: ./tarlib/.github/actions/setup-ada-workspace
      - name: Build library
        working-directory: tarlib
        shell: bash
        run: |
          set -o pipefail

          #  A clean build says nothing, and nobody was checking that here:
          #  `alr build` exits 0 with warnings on its output, so a (style)
          #  complaint or a variable left behind by a refactor reached the
          #  repository and stayed. It survives locally too, because an
          #  incremental build does not recompile the file that carries it --
          #  which is why a fresh runner is the right place to ask.
          #
          #  This crate's own units only. `alr build` compiles the path
          #  dependencies as well, and what one of those has to say about its
          #  own sources belongs to its own repository.
          alr -n build 2>&1 | tee "${RUNNER_TEMP:-/tmp}/build-output.txt"
          if grep -Eq "^tarlib[a-z0-9_.-]*\.(ad[bs]|c|h):[0-9]+:[0-9]+: " \
             "${RUNNER_TEMP:-/tmp}/build-output.txt"
          then
            echo "The build said something. A clean build says nothing:"
            grep -E "^tarlib[a-z0-9_.-]*\.(ad[bs]|c|h):[0-9]+:[0-9]+: " \
              "${RUNNER_TEMP:-/tmp}/build-output.txt"
            exit 1
          fi
      - name: Run manifest test action
        working-directory: tarlib
        run: alr --non-interactive test
      - name: Build checker
        working-directory: tarlib/check_tarlib
        run: alr --non-interactive build
      - name: Run tarlib checker
        working-directory: tarlib/check_tarlib
        run: ./bin/check_tarlib
