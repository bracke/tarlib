name = "tarlib_tests"
description = "AUnit test suite for tarlib"
version = "0.1.0"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
executables = ["tarlib_tests"]
project-files = ["tarlib_tests.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
tarlib = "*"

[[depends-on]]
aunit = "^26.0.0"

# The ACL test asks whether this host has setfacl at all, and whether the
# filesystem under the scratch directory will take an ACL, before asserting
# that tarlib applied one.
[[depends-on]]
hostkit = "*"

[[depends-on]]
project_tools = "~0.1.0"

[[pins]]
hostkit = { path = "../../../hostkit" }

[[pins]]
tarlib = { path = "../.." }

[[pins]]
project_tools = { path = "../../../project_tools" }

[build-profiles]
"*" = "development"
